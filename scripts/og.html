<!DOCTYPE html>
<!-- Source of assets/og.png (1200 x 630). Render it with a browser at that size from the repository root. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #fff; color-scheme: light; }
  .card { position: relative; height: 630px; border-top: 14px solid #0b2942; display: grid; grid-template-columns: 520px 1fr; }
  .text { padding: 56px 0 0 64px; }
  .brand { display: flex; align-items: center; gap: 14px; font: 600 30px/1 var(--sans); color: #0b2942; }
  .brand img { width: 56px; height: 56px; }
  h1 { font: 600 50px/1.1 var(--sans); color: #0b2942; margin: 40px 0 28px; letter-spacing: -0.01em; }
  .rail { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid #0b2942; }
  .rail li { font: 20px/1.7 var(--mono); color: #4a525c; }
  .rail li::before { content: "$ "; color: #66707b; }
  .shot { position: relative; overflow: hidden; }
  .shot img { position: absolute; left: 8px; top: 64px; width: 1000px; height: auto; }
  .foot { position: absolute; left: 64px; bottom: 36px; font: 18px/1 var(--mono); color: #66707b; }
</style>
</head>
<body>
  <div class="card">
    <div class="text">
      <div class="brand"><img src="../assets/icon.png" alt="">Gantry</div>
      <h1>The Mac app for Apple container and Docker</h1>
      <ul class="rail"><li>container run</li><li>docker compose up</li><li>kubectl logs -f</li></ul>
    </div>
    <div class="shot"><img src="../assets/fleet.png" alt=""></div>
    <div class="foot">getgantry.github.io · free · MIT</div>
  </div>
</body>
</html>
